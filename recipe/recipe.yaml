schema_version: 1

context:
  version: 0.10.3

package:
  name: eo-tides
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/eo-tides/eo_tides-${{ version }}.tar.gz
  sha256: 18efa9acf11ab89ff7b51b9ac1258b90fe47d838a16ad25e216d9470547bf595

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - colorama >=0.4.3
    - dask-core >=2023.1.0
    - geopandas >=0.10.0
    - matplotlib-base >=3.8.0
    - numpy >=1.26.0
    - odc-geo >=0.4.7
    - odc-stac >=0.4.0
    - pandas >=2.2.0
    - planetary-computer >=1.0.0
    - psutil >=6.0.0
    - pyogrio >=0.10.0
    - pyproj >=3.7.0
    - pystac-client >=0.8.3
    - pytmd >=2.2.8,<3.0.0
    - scikit-learn >=1.4.0
    - scipy >=1.14.1
    - shapely >=2.0.6
    - timescale >=0.0.3
    - tqdm >=4.55.0
    - xarray >=2022.3.0

tests:
  - python:
      imports:
        - eo_tides
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Tide modelling tools for large-scale satellite earth observation analysis
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://GeoscienceAustralia.github.io/eo-tides/
  documentation: https://GeoscienceAustralia.github.io/eo-tides/

extra:
  recipe-maintainers:
    - ocefpaf
